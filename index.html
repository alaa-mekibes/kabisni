<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="كبسني لعبة ويب إدمانية! اجمع النقاط، حارب حشرات الهورينغ، أنقذ صديقك لهنت، وواجه البوس الشرير في عالم رمادي مليء بالتحديات. ابدأ اللعب فوراً بدون حساب، وتنافس مع أفضل الكابسين!"
    />
    <meta name="author" content="َAlaa MEKIBES" />
    <meta property="og:title" content="كبسني | Kabisni" />
    <meta
      property="og:description"
      content="كبسني لعبة ويب إدمانية! اجمع النقاط، حارب حشرات الهورينغ، أنقذ صديقك لهنت، وواجه البوس الشرير في عالم رمادي مليء بالتحديات. ابدأ اللعب فوراً بدون حساب، وتنافس مع أفضل الكابسين!"
    />
    <meta property="og:url" content="https://kabisni.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/img/Kabisni-thumbnail.webp" />
    <!-- fonts -->
    <link href="https://fonts.cdnfonts.com/css/funny" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- website settigns -->
    <meta name="theme-color" content="#FFC000" />
    <link href="manifest.json" rel="manifest" />
    
    <link
      rel="shortcut icon"
      href="assets/img/favicon-32x32.webp"
      type="image/x-icon"
    />
    <!-- css -->
    <link rel="stylesheet" href="assets/css/style.css?v=2" />
    <!-- board avatars preloaded so first open doesn't decode mid-fade -->
    <link rel="preload" as="image" href="assets/img/leader.webp" />
    <link rel="preload" as="image" href="assets/img/others.webp" />
    <title>كبسني | Kabisni</title>
  </head>
  <body>
    <!-- Start Header -->
    <header class="header_container">
      <div class="score">
        <span></span>
      </div>
      <div class="logo">
        <a href="" aria-label="website logo"
          ><img src="assets/img/كبسني.webp" alt="كبسني"
        /></a>
      </div>
      <div class="store_icon">
        <button>المتجر</button>
      </div>
    </header>
    <!-- Start Main -->
    <main class="main_container">
      <div class="store">
        <div class="close_container">
          <span class="close" title="close">X</span>
        </div>
        <div class="myPoints">
          <p>رصيدك: <span id="pointStore"></span> زمبيط</p>
        </div>
        <ul id="menu" class="menu">
          <li><button id="skins">skins</button></li>
          <li><button id="animations">animations</button></li>
          <li><button id="colors">colors</button></li>
          <li><button id="sounds">sounds</button></li>
        </ul>
      </div>
      <div class="shape player circle"></div>

            <!-- Start name gate (nickname only, no signup) -->
            <div dir="rtl" id="nickname" class="start box">
              <h2>من أنت يا مكبس ؟</h2>
              <div class="inputs">
                <input id="nicknameInput" type="text" maxlength="16" placeholder="اسمك في اللعبة" />
              </div>
              <p class="ask">الاسم يحفظ على جهازك فقط، بدون حساب ولا تسجيل.</p>
              <div class="buttons">
                <button id="saveNickname">حفظ</button>
              </div>
            </div>

      <!-- Start Start-menu -->
      <div dir="rtl" id="start_menu" class="start box" style="display: none;">
        <h2>هل أنت مستعد للتكبيس !</h2>
          <span id="username-display"></span>
        <p class="ask">مستعجل؟ <button id="changeName">تغيير الاسم</button></p>
        <div class="buttons">
        <button id="start">إبدأ</button>
        </div>
        <p class="extra-links">
        <button id="bestKabasin" title="أفضل الكباسين">أفضل الكباسين</button>
        </p>
      </div>
      <!-- Start leaderBoarder (.others/.leader nodes written by renderLeaderboard()) -->
      <div class="leaderBoarder box" style="display: none;">
        <div class="close_container">
          <button class="close">X</button>
        </div>

        <ul class="others">
        </ul>
        <div class="leader">
          <h3>أفضل مكبس</h3>
          <div class="profile_pic before-profile-leaders">
          <img src="assets/img/leader.webp" alt="leader">

          </div>
          <h4 class="name"></h4>
          <span class="point"></span>
        </div>
      </div>

      <!-- enemy -->
      <div class="enemy">
        <div class="space-invader"></div>
      </div>
    </main>
    <!-- Start Footter -->
    <footer class="footer_container">
      <p>
        &copy; <a href="https://github.com/alaa-mekibes/kabisni">Alaa MEKIBES</a>
      </p>
            <!-- Timer -->
            <div id="timer" style="font-weight: 500; display: none;">0.0</div>
      <button id="save" title="انتظر 10 ثواني">حفظ التقدم</button>
    </footer>
    <script src="assets/js/main.js?v=6"></script>
  </body>
</html>
